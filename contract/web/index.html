<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1018">
  <title>Bbillionaire</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --gold: #e8bd72; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f5f2e9;
      background:
        radial-gradient(ellipse at 82% 4%, rgba(114, 91, 54, .14), transparent 34rem),
        radial-gradient(ellipse at 4% 32%, rgba(43, 74, 69, .1), transparent 32rem),
        #0b1018;
    }
    main { width: 100%; max-width: 520px; text-align: center; border: 1px solid rgba(232, 189, 114, .13); border-radius: 22px; background: linear-gradient(145deg, #171d25, #131a23); padding: 44px 28px; }
    .mark { display: grid; width: 52px; height: 52px; margin: 0 auto 20px; place-items: center; border: 1px solid rgba(232, 189, 114, .34); border-radius: 16px; background: linear-gradient(145deg, rgba(232, 189, 114, .2), rgba(232, 189, 114, .04)); color: var(--gold); font-size: 23px; font-weight: 850; }
    h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.03em; }
    .caption { margin: 0 0 22px; color: #7e8998; font-size: 10px; font-weight: 750; letter-spacing: .14em; }
    p { margin: 0; color: #9ba5b2; font-size: 14px; line-height: 1.65; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">B</div>
    <h1>Bbillionaire</h1>
    <p class="caption">ON-CHAIN DASHBOARD</p>
    <p>The dashboard is being updated. Please check back soon.</p>
  </main>
</body>
</html>
